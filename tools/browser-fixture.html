<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PageEcho browser fixture</title>
    <style>
      body { font: 14px system-ui; padding: 24px; }
      pre { background: #111; color: #6f6; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>PageEcho 真实浏览器夹具</h1>
    <p id="status">waiting…</p>

    <script>
      // The page drives the injected UI through the (open) shadow root, then
      // writes a machine-readable result into the DOM for --dump-dom.
      (function () {
        var result = {
          host: false,
          shadow: false,
          fab: false,
          stylesheet: false,
          modalClosedBeforeClick: true,
          modalAfterClick: false,
          textarea: false,
          triggerChips: 0,
          scopeChips: 0,
          error: null
        };

        function report() {
          var pre = document.createElement('pre');
          pre.id = 'pageecho-result';
          pre.textContent = 'PAGEECHO_RESULT=' + JSON.stringify(result);
          document.body.appendChild(pre);
        }

        setTimeout(function () {
          try {
            var host = document.getElementById('pageecho-host');
            result.host = !!host;
            var sr = host && host.shadowRoot;
            result.shadow = !!sr;
            if (!sr) {
              report();
              return;
            }
            result.stylesheet = sr.querySelectorAll('style').length > 0 || (sr.adoptedStyleSheets || []).length > 0;
            var fab = sr.querySelector('.pe-fab');
            result.fab = !!fab;
            result.modalClosedBeforeClick = !sr.querySelector('.pe-modal');
            if (fab) fab.click();
            setTimeout(function () {
              var modal = sr.querySelector('.pe-modal');
              result.modalAfterClick = !!modal;
              if (modal) {
                result.textarea = !!modal.querySelector('textarea.pe-textarea');
                result.triggerChips = modal.querySelectorAll('.pe-chiprow')[0]
                  ? modal.querySelectorAll('.pe-chiprow')[0].children.length
                  : 0;
                result.scopeChips = modal.querySelectorAll('.pe-chiprow')[1]
                  ? modal.querySelectorAll('.pe-chiprow')[1].children.length
                  : 0;
              }
              report();
            }, 900);
          } catch (e) {
            result.error = String(e && e.message ? e.message : e);
            report();
          }
        }, 3500);
      })();
    </script>
  </body>
</html>
