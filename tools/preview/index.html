<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PageEcho · 样式预览</title>
    <style>
      /* GitHub dark: canvas, Boxes, one accent. The preview menu is a page like
         any other, so it wears the same language as the surfaces it links to. */
      body {
        margin: 0;
        padding: 0 32px 64px;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 21px;
        -webkit-font-smoothing: antialiased;
      }
      header.bar {
        margin: 0 -32px;
        padding: 14px 32px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 600;
      }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 22px; line-height: 32px; margin: 26px 0 6px; font-weight: 600; }
      p.lead { color: #8b949e; margin: 0 0 24px; }
      a.card {
        display: block;
        text-decoration: none;
        color: inherit;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #161b22;
        padding: 14px 18px;
        margin-bottom: 12px;
        transition: background-color 0.14s ease, border-color 0.14s ease;
      }
      a.card:hover { background: #1c2128; border-color: #6e7681; }
      a.card:focus-visible { outline: 2px solid #1f6feb; outline-offset: -2px; }
      a.card b { display: block; font-size: 16px; font-weight: 600; }
      a.card span { color: #8b949e; font-size: 13px; }
      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        color: #58a6ff;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <header class="bar">PageEcho<span style="color:#8b949e;font-weight:400;font-size:13px">样式预览</span></header>
    <main>
      <h1>PageEcho 样式预览</h1>
      <p class="lead">
        直接双击打开即可，不需要加载扩展：<code>tools/preview/stub.js</code> 用假数据顶替了
        chrome.storage，其余脚本都是 src/ 里的真文件。
      </p>
      <a class="card" href="inpage.html?view=cards&theme=dark">
        <b>页面内 · 卡片</b>
        <span>停在真实页面上：悬浮按钮、叠放的两张卡片、倒计时条、Toast（深色）</span>
      </a>
      <a class="card" href="inpage.html?view=cards&theme=light">
        <b>页面内 · 卡片（浅色）</b>
        <span>同一组界面切到浅色主题</span>
      </a>
      <a class="card" href="inpage.html?view=composer&theme=dark">
        <b>创作弹窗</b>
        <span>留一句话：绑定范围、触发条件、底部动作</span>
      </a>
      <a class="card" href="inpage.html?view=panel&theme=dark">
        <b>本页回声面板</b>
        <span>列表、状态胶囊、逐条动作</span>
      </a>
      <a class="card" href="manager.html">
        <b>管理页</b>
        <span>页头、侧栏、工具栏、列表卡片（窗口越宽列数越多）</span>
      </a>
      <a class="card" href="popup.html">
        <b>工具栏弹窗</b>
        <span>把窗口拖到 372px 宽左右看效果</span>
      </a>
    </main>
  </body>
</html>
